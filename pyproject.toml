[project]
name = "repo-intelligence"
version = "0.1.0"
description = "Repository Intelligence RAG System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyright>=1.1.411",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
