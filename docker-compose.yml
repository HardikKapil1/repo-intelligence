services:
  postgres:
    image: postgres:17

    container_name: repo-intelligence-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: repo_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: