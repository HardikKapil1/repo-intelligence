services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: repo-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: repo_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: repo-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-intelligence-worker
    restart: unless-stopped
    command: uv run rq worker ingestion
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/repo_intelligence
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: